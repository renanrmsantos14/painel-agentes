<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel Agentes</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="brand">
          <div class="logo" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.4"/><circle cx="6" cy="18" r="2.4"/><circle cx="18" cy="12" r="2.4"/><path d="M6 8.4v7.2M8.2 6.9c4.6.4 7.6 1.9 7.9 3.4"/></svg>
          </div>
          <div>
            <h1>Painel Agentes</h1>
            <p id="summary" class="sub">Lendo chats e repositórios…</p>
          </div>
        </div>
        <div class="controls">
          <label class="search">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
            <input id="q" type="search" placeholder="Buscar chat, projeto ou branch" autocomplete="off" />
          </label>
          <select id="project" aria-label="Projeto"><option value="">Todos os projetos</option></select>
          <select id="days" aria-label="Período">
            <option value="3">3 dias</option>
            <option value="7">7 dias</option>
            <option value="30">30 dias</option>
            <option value="90">90 dias</option>
          </select>
          <button id="update" class="update-btn" hidden></button>
          <button id="refresh" class="icon-btn" title="Atualizar agora (F5)" aria-label="Atualizar agora">
            <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
          </button>
          <details class="menu prefs">
            <summary class="icon-btn" title="Preferências" aria-label="Preferências">
              <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 12h4M12 12h8M4 17h12M20 17h0"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="17" r="2"/></svg>
            </summary>
            <div class="menu-panel">
              <div class="menu-label">Agente</div>
              <div class="seg" id="agent" role="radiogroup" aria-label="Agente">
                <button role="radio" data-v="all" class="on">Todos</button>
                <button role="radio" data-v="claude"><i class="dot claude"></i>Claude</button>
                <button role="radio" data-v="codex"><i class="dot codex"></i>Codex</button>
              </div>
              <hr />
              <label class="toggle"><input id="archived" type="checkbox" /><span>Mostrar chats arquivados</span></label>
              <label class="toggle"><input id="autostart" type="checkbox" /><span>Iniciar com o Windows<small>Abre na bandeja, para os avisos funcionarem</small></span></label>
            </div>
          </details>
        </div>
      </header>

      <nav id="status" class="chips" aria-label="Foco"></nav>
      <main id="board" class="board" aria-live="polite"></main>
    </div>

    <div id="tip" class="tip" aria-hidden="true"></div>
    <div id="ctx" class="ctx" role="menu" aria-label="Ações"></div>
    <div id="modal" class="overlay" hidden></div>
    <div id="toast" class="toast" role="status"></div>
    <div id="version" class="version" aria-hidden="true"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
